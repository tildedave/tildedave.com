<!DOCTYPE html>
<html lang="en-us">
  <head>
    <title>{{ page.title }}</title>
    <link href="/stylesheets/app.css?v={{ site.time | date: '%s' }}" media="screen, projector, print" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" type="text/css" href="/stylesheets/syntax.css?v={{ site.time | date: '%s' }}"></link>
    <link rel="canonical" href="{{ site.url }}{{ page.url }}"></link>
    {% if page.url == "/index.html" %}
    <meta name="description" content="Dave King is a software professional living in Durham, NC.  He writes about software design, thinking techniques, and team processes.">
    {% else %}
    {% assign meta_description = page.description | default: page.excerpt | default: content %}
    <meta name="description" content="{{ meta_description | strip_html | strip_newlines | strip | truncate: 160 | escape_once }}" />
    {% endif %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/x-mathjax-config">
      MathJax.Hub.Config({
        tex2jax: {
          inlineMath: [ ['$','$'], ["\\(","\\)"] ],
          processEscapes: true
        }
      });
    </script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.1/MathJax.js?config=TeX-AMS-MML_HTMLorMML">
    </script>
  </head>
  <body>
    <div class="container">
      {{ content }}
    </div>
  </body>
</html>
